name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          CI: true
          Base_URL: ${{ vars.Base_URL || secrets.Base_URL }}
          Email: ${{ vars.Email || secrets.Email }}
          PASSWORD: ${{ vars.PASSWORD ||secrets.PASSWORD }}
          Invalid_EMAIL: ${{ vars.Invalid_EMAIL ||secrets.Invalid_EMAIL }}
          Invalid_PASSWORD: ${{ vars.Invalid_PASSWORD ||secrets.Invalid_PASSWORD }}
          CARD_NAME: ${{ vars.CARD_NAME ||secrets.CARD_NAME }}
          CARD_NUMBER: ${{ vars.CARD_NUMBER ||secrets.CARD_NUMBER }}
          CARD_CVC: ${{ vars.CARD_CVC ||secrets.CARD_CVC }}
          CARD_EXPIRYMONTH: ${{ vars.CARD_EXPIRYMONTH || secrets.CARD_EXPIRYMONTH }}
          CARD_EXPIRYYEAR: ${{ vars.CARD_EXPIRYYEAR || secrets.CARD_EXPIRYYEAR }}




      - name: Generate Allure report
        if: ${{ !cancelled() }}
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30